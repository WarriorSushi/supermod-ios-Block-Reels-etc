name: Supermod
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    exactVersion: 5.102.3
targets:
  Supermod:
    type: application
    platform: iOS
    sources:
      - path: Supermod
        excludes: [Resources/SupermodIcon.icon]
      - path: Supermod/Resources/SupermodIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: RevenueCat
        product: RevenueCat
    info:
      path: Supermod/Info.plist
      properties:
        UILaunchStoryboardName: LaunchScreen
        RevenueCatPublicAPIKey: "$(REVENUECAT_PUBLIC_API_KEY)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.supermod.ios
        REVENUECAT_PUBLIC_API_KEY: ""
        INFOPLIST_KEY_CFBundleDisplayName: Supermod
        ASSETCATALOG_COMPILER_APPICON_NAME: SupermodIcon
        TARGETED_DEVICE_FAMILY: "1"
  SupermodTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - path: Supermod.storekit
        buildPhase: resources
    dependencies:
      - target: Supermod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.supermod.ios.tests
  SupermodUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
      - path: Supermod.storekit
        buildPhase: resources
    dependencies:
      - target: Supermod
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.supermod.ios.uitests
schemes:
  Supermod:
    build:
      targets:
        Supermod: all
    run:
      config: Debug
      storeKitConfiguration: Supermod.storekit
      environmentVariables:
        SUPERMOD_LOCAL_STOREKIT: "1"
    test:
      config: Debug
      targets: [SupermodTests, SupermodUITests]

  Supermod Sandbox:
    build:
      targets:
        Supermod: all
    run:
      config: Debug
